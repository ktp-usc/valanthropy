izations and people who make our work possible.</p><a class="inline-block rounded bg-red-700 px-8 py-3 text-xs font-semibold text-white" href="/start-a-conversation">Become a Partner</a></div></section><section class="bg-white px-8 py-14 md:px-16"><div class="mx-auto max-w-5xl"><h2 class="mb-3 text-2xl font-bold text-red-700">Businesses Building the Way Home</h2><p class="max-w-2xl text-sm text-slate-600">Whether you engage your customers, challenge your employees, sponsor an event, provide needed products or services, or make a financial investment, your business can help VAlanthropy build permanent housing and long-term stability for veterans.</p></div></section><section class="bg-blue-900 px-8 py-14 text-white md:px-16"><div class="mx-auto max-w-5xl"><h2 class="mb-3 text-2xl font-bold">Why It Matters</h2><p class="mb-3 max-w-2xl text-sm">Hidden Wounds Village Alpha is VAlanthropy’s flagship veteran housing initiative in Sumter, South Carolina. The community will include 12 permanent, affordable one-bedroom apartments designed to give veterans the stability, connection, and support needed to move forward.</p><p class="max-w-2xl text-sm">VAlanthropy leads the development, infrastructure, construction, furnishing, and long-term sustainability of the community. Business partnerships help us continue this work and prepare the village to become a place veterans can truly call home.</p></div></section><section class="bg-slate-100 px-8 py-14 md:px-16"><div class="mx-auto max-w-5xl"><h2 class="mb-6 text-2xl font-bold text-red-700">Ways to Partner With Us</h2><ul class="grid gap-4 md:grid-cols-6"><li class="rounded border border-slate-200 bg-white p-5 md:col-span-2 "><h3 class="mb-2 text-sm font-bold">Create a Lasting Legacy</h3><p class="text-xs text-slate-600">Purchase a Legacy Brick, sponsor an approved space or furnishing goal, or develop an annual signature partnership.</p></li><li class="rounded border border-slate-200 bg-white p-5 md:col-span-2 "><h3 class="mb-2 text-sm font-bold">Engage Your Customers</h3><p class="text-xs text-slate-600">Round up purchases, dedicate a percentage of sales, feature a product for a purpose, or add a donation opportunity at checkout.</p></li><li class="rounded border border-slate-200 bg-white p-5 md:col-span-2 "><h3 class="mb-2 text-sm font-bold">Activate Your Team</h3><p class="text-xs text-slate-600">Create a $20 for 12 workplace challenge, offer matching gifts, hold a department competition, or introduce payroll giving.</p></li><li class="rounded border border-slate-200 bg-white p-5 md:col-span-2 md:col-start-2"><h3 class="mb-2 text-sm font-bold">Host an Event With Purpose</h3><p class="text-xs text-slate-600">Organize a class, dinner, tournament, community event, open house, networking mixer, or customer appreciation fundraiser</p></li><li class="rounded border border-slate-200 bg-white p-5 md:col-span-2 "><h3 class="mb-2 text-sm font-bold">Provide What You Do Best</h3><p class="text-xs text-slate-600">Contribute approved furnishings, household essentials, meals, professional services, printing, marketing, labor, or event support.</p></li></ul><div class="mt-10 text-center"><a class="inline-block rounded bg-red-700 px-12 py-4 text-sm font-semibold text-white" href="/start-a-conversation">Start a Conversation</a></div></div></section><section class="bg-white py-14"><div class="mx-auto mb-6 max-w-5xl px-8 md:px-16"><h2 class="text-2xl font-bold text-red-700">Our Sponsors</h2></div><div class="marquee overflow-hidden"><ul class="marquee-track flex w-max gap-6 pr-6"><li class="w-56 shrink-0" aria-hidden="false"><div class="relative flex aspect-[3/2] items-center justify-center rounded border border-slate-200 bg-white p-4 text-center"><img alt="National Christian Foundation" class="object-contain p-4" style="position:absolute;height:100%;width:100%;left:0;top:0;right:0;bottom:0;color:transparent" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAABDCAMAAAARdsh8AAAAIGNIUk0AAHomAACAhAAA+gAAAI
